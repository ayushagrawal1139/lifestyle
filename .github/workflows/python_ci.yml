name: Python CI

on:
  push:
    branches: [ main, feature/lifestyle-college-student ]
  pull_request:
    branches: [ main, feature/lifestyle-college-student ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
          cache: 'pip'  # Enable caching

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev python3-pip

      - name: Create and activate virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV

      - name: Install Python packages
        run: |
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install --force-reinstall pandas numpy scikit-learn xgboost openpyxl matplotlib seaborn joblib
          pip freeze > requirements.txt
          cat requirements.txt

      - name: Verify environment
        run: |
          source venv/bin/activate
          which python
          python -m pip list
          python -c "import pandas as pd; print(f'Pandas {pd.__version__} successfully imported')"

      - name: Run data collection
        run: |
          source venv/bin/activate
          python scripts/data_collection.py