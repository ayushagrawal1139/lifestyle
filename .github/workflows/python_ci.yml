name: Python CI

on:
  push:
    branches: [ main, feature/lifestyle-college-student ]
  pull_request:
    branches: [ main, feature/lifestyle-college-student ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}  # This ensures proper environment sourcing
    
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir pandas numpy openpyxl
          pip list  # Verify installed packages

      - name: Verify pandas installation
        run: |
          python -c "import pandas as pd; print(f'Pandas version: {pd.__version__}')"
          python -c "import sys; print('\n'.join(sys.path))"  # Show Python path

      - name: Run data collection
        run: |
          python scripts/data_collection.py
          