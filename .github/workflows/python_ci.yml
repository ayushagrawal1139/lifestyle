name: Python CI

on:
  push:
    branches: [ main, feature/lifestyle-college-student ]
  pull_request:
    branches: [ main, feature/lifestyle-college-student ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
          
      - name: Get Python location
        run: |
          which python
          python --version
          pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --no-cache-dir pandas==1.3.0 numpy==1.21.0 scikit-learn==0.24.2 xgboost==1.4.2
          pip install --no-cache-dir openpyxl==3.0.7 matplotlib==3.4.2 seaborn==0.11.1 joblib==1.0.1
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Verify installations
        run: |
          python -m pip list
          python -c "import sys; print(sys.path)"
          python -c "import pandas as pd; print(f'Pandas {pd.__version__} successfully imported')"
          python -c "import numpy as np; print(f'Numpy {np.__version__} successfully imported')"

      - name: Run data collection
        run: |
          python -c "import pandas as pd; print('Pandas available:', pd.__version__)" || echo "Pandas import failed"
          python scripts/data_collection.py